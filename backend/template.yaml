AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Factufast MVP — CFDI 4.0 con Facturama

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Layers:
      - !Ref DepsLayer
    Environment:
      Variables:
        DYNAMODB_TABLE: !Ref FacturasTable
        FACTURAMA_USER: !Sub "{{resolve:ssm:/factufast/facturama_user}}"
        FACTURAMA_PASS: !Sub "{{resolve:ssm:/factufast/facturama_pass}}"

Resources:

  DepsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layers/
      CompatibleRuntimes: [python3.12]
    Metadata:
      BuildMethod: python3.12

  CrearFacturaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.crear_factura.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FacturasTable
      Events:
        PostFactura:
          Type: Api
          Properties:
            Path: /facturas
            Method: POST

  FacturasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "factufast-facturas-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: rfc
          AttributeType: S
        - AttributeName: folio_fiscal
          AttributeType: S
      KeySchema:
        - AttributeName: rfc
          KeyType: HASH
        - AttributeName: folio_fiscal
          KeyType: RANGE

Outputs:
  ApiUrl:
    Description: Endpoint del API Gateway
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/facturas"
